<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The System</title>
<style>
:root{--bg:#04070f;--p:#0a1224;--p2:#0e1a33;--l:#1c3a66;--c:#35e0ff;--c2:#1d7fd6;--t:#dbe9ff;--m:#7f95b8;--ok:#3de0a0;--bad:#ff6b7a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 500px at 70% -10%,#0d2447,transparent),var(--bg);color:var(--t);font:16px/1.45 "Segoe UI",Roboto,system-ui,sans-serif;padding-bottom:84px}
main{max-width:980px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0 0 8px;letter-spacing:.02em}h2{font-size:1.15rem;color:var(--c)}h3{font-size:1rem}
.card{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid var(--l);border-left:3px solid var(--c);padding:14px;margin:0 0 12px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.grid{display:grid;gap:12px}@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
button,select,input{font:inherit;color:var(--t);background:#07101f;border:1px solid var(--l);padding:10px 12px;min-height:44px;border-radius:0}
button{cursor:pointer;background:linear-gradient(#10305a,#0a2145);border-color:var(--c2)}button:hover{box-shadow:0 0 12px #35e0ff55}
button.pri{background:linear-gradient(#17a6c9,#0e6f94);color:#001018;font-weight:700}button.dng{border-color:var(--bad);color:var(--bad)}button.sm{min-height:44px;padding:6px 10px}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
input[type=text],input[type=number],select{width:100%}input[type=checkbox]{min-height:0;width:22px;height:22px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 1 auto}.grow{flex:1 1 140px!important}
.bar{height:16px;background:#050c18;border:1px solid var(--l);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c2),var(--c));box-shadow:0 0 12px var(--c);transition:width .4s}
.m{color:var(--m);font-size:.9rem}.big{font-size:2.6rem;font-weight:700;color:var(--c);text-shadow:0 0 18px #35e0ff88;font-variant-numeric:tabular-nums}
.rank{width:84px;height:96px;display:grid;place-items:center;font-size:2.6rem;font-weight:800;color:var(--c);background:#061226;border:2px solid var(--c);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);text-shadow:0 0 14px var(--c)}
.q{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #12233f;flex-wrap:wrap}.q .n{flex:1 1 200px}.done .n{text-decoration:line-through;color:var(--m)}
.tag{font-size:.78rem;border:1px solid var(--l);padding:1px 6px;color:var(--m)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#050b17f2;border-top:1px solid var(--c2);z-index:5}nav button{flex:1;border:0;border-top:3px solid transparent;background:none;min-height:60px;padding:4px;font-size:.85rem}nav button.on{border-top-color:var(--c);color:var(--c)}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9;display:grid;gap:6px;width:min(92vw,520px)}
.t{background:#06182e;border:1px solid var(--c);padding:10px 14px;box-shadow:0 0 18px #35e0ff66}.t.e{border-color:var(--bad);color:var(--bad)}
.ms{display:flex;gap:6px}.ms span{flex:1;text-align:center;border:1px solid var(--l);padding:6px 0;color:var(--m)}.ms span.on{border-color:var(--c);color:var(--c);box-shadow:0 0 10px #35e0ff66}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px}.bars div{flex:1;text-align:center;font-size:.75rem;color:var(--m)}.bars i{display:block;background:var(--c2);min-height:2px}
.warn{border-left-color:#ffb84d}.reduce *{transition:none!important;animation:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* THE SYSTEM — Hunter Edition visual refinement */
:root{
 --bg:#050812;--p:#0a1020;--p2:#0d1830;--l:#233b61;
 --c:#65e7ff;--c2:#168bc8;--t:#e8f4ff;--m:#91a7c7;
 --ok:#65f0b2;--bad:#ff718b;
}
html{scroll-behavior:smooth}
body{
 background:
  radial-gradient(ellipse at 50% -15%,rgba(21,100,181,.30),transparent 48%),
  radial-gradient(ellipse at 100% 30%,rgba(0,211,255,.07),transparent 35%),
  #050812;
 color:var(--t);letter-spacing:.01em
}
main{max-width:1180px;padding:clamp(12px,2vw,24px);padding-bottom:24px}
h1{font-size:clamp(1.55rem,3vw,2.1rem);text-shadow:0 0 22px #42cfff26}
h2{font-size:1.08rem;letter-spacing:.08em;text-transform:uppercase}
.card{
 position:relative;isolation:isolate;overflow:hidden;
 background:linear-gradient(145deg,rgba(15,29,55,.97),rgba(7,13,27,.98));
 border:1px solid #29496f;border-left:2px solid var(--c);
 border-radius:4px;padding:clamp(14px,2vw,22px);margin-bottom:14px;
 clip-path:none;box-shadow:0 8px 28px #0005,inset 0 1px 0 #9be9ff0c
}
.card:after{content:"";position:absolute;z-index:-1;top:0;right:0;width:70px;height:2px;background:linear-gradient(90deg,transparent,var(--c));opacity:.8}
.grid{gap:14px}
@media(min-width:760px){.grid{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}}
button,select,input{
 border:1px solid #2a4d77;border-radius:4px;background:#081326;
 transition:background .18s,border-color .18s,box-shadow .18s,transform .18s
}
button{background:linear-gradient(180deg,#122b4d,#0a1b34);border-color:#287eb4}
button:hover{border-color:var(--c);box-shadow:0 0 16px #2edbff24}
button:active{transform:translateY(1px)}
button.pri{background:linear-gradient(135deg,#6beaff,#199acb);border-color:#7cecff;color:#04101a;box-shadow:0 0 18px #20c9ff22}
button.dng{background:#24101c;border-color:#a63b5a;color:#ff9bad}
.row{gap:9px}
.bar{height:12px;border-radius:2px;border-color:#25476c;background:#040a14}
.bar i{background:linear-gradient(90deg,#1686d5,#61edff);box-shadow:0 0 15px #42dfff88}
.big{font-size:clamp(2.2rem,5vw,3.1rem);letter-spacing:-.04em;text-shadow:0 0 22px #35e0ff44}
.rank{border-radius:4px;background:linear-gradient(145deg,#102b4a,#06101f);border-color:#5fe7ff;box-shadow:0 0 24px #16caff20;text-shadow:0 0 18px #55e9ff}
.q{padding:13px 0;border-bottom:1px solid #1c3150;gap:8px}
.q:last-child{border-bottom:0}
.q .n{line-height:1.55;min-width:180px}
.tag{border-radius:3px;border-color:#2a4c72;background:#09162a;padding:2px 7px;font-size:.76rem}
.ms span{border-radius:3px;border-color:#203b5d;background:#071020}
.ms span.on{background:#0c2d45;box-shadow:0 0 12px #35e0ff20}
nav{background:rgba(4,9,19,.96);backdrop-filter:blur(16px);border-top:1px solid #245b82;box-shadow:0 -8px 28px #0005}
nav button{font-size:.82rem;letter-spacing:.02em;color:#a9bdd8}
nav button.on{color:var(--c);background:linear-gradient(180deg,#12314a44,transparent);border-top-color:var(--c);text-shadow:0 0 12px #35e0ff55}
#toast .t{border-radius:4px;background:#0b1b31;border-color:var(--c);box-shadow:0 0 22px #35e0ff30}
#toast .t.e{border-color:var(--bad)}
input:focus,select:focus,button:focus-visible{outline:2px solid #62eaff;outline-offset:2px}
a{color:var(--c)}
@media(max-width:560px){
 body{font-size:15px}
 main{padding:10px;padding-bottom:20px}
 .card{padding:13px}
 .big{font-size:2.1rem}
 nav button{font-size:.72rem;padding-inline:2px}
 .q .n{flex-basis:100%}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

<script>
"use strict";
const SUBJ=["Physics","Chemistry","Biology","Revision","Other"],CH=["Physics","Chemistry","Biology"];
const ST=["Not started","In progress","First pass completed","Revision due","Revised","Test completed"];
const GOAL=300;
const DAILY=[["Physics: finish a lecture or chapter part","Physics",2,60,30,5],["Physics: revise concepts and formulas","Physics",1,30,15,2],["Physics: solve DPP questions","Physics",2,45,25,4],["Physics: attempt PYQs and analyse mistakes","Physics",3,60,35,5],
["Chemistry: finish a lecture or topic","Chemistry",2,60,30,5],["Chemistry: practise numericals or reactions","Chemistry",2,45,25,4],["Chemistry: revise NCERT and notes","Chemistry",1,30,15,2],["Chemistry: attempt DPP or PYQs","Chemistry",3,45,30,4],
["Biology: read NCERT actively","Biology",2,60,30,5],["Biology: recall practice and MCQs","Biology",2,45,25,4],["Biology: revise diagrams, tables, facts","Biology",1,30,15,2],["Biology: attempt PYQs","Biology",3,45,30,4],
["Complete a revision session","Revision",2,45,25,4],["Review the error log","Other",1,20,15,2]];
const WEEKLY=[["Weekly review: what worked, what to fix","Other",2,30,40,8],["Analyse a mock test","Other",3,60,60,10],["Boss mission: finish this week's planned test or revision target","Revision",3,120,120,25]];
const ACH={first:["First Step","Complete your first focus session"],q1:["Quest Taker","Complete your first quest"],h1:["Hour One","Study 1 hour in a day"],h5:["Daily Target","Reach 5 focused hours in a day"],l5:["Level 5","Reach level 5"],back:["Welcome Back","Study again after 3+ days away"],err:["Honest Review","Complete an error-log review"]};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dstr=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>dstr(Date.now()),weekKey=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return dstr(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function fresh(){return{v:1,name:"Hunter",created:Date.now(),lastExport:0,quests:[],tx:[],sessions:[],chapters:[],shop:[{id:uid(),name:"Planned 15-minute break",price:20},{id:uid(),name:"One anime episode",price:60},{id:uid(),name:"Favourite snack",price:40}],seeded:{},ach:{},timer:null,set:{focus:50,brk:10,sound:true,reduce:false,rest:{}}}}
let S=fresh(),db=null,view="home",filter="All",memOnly=false;
/* ---- pure logic ---- */
function totals(s){let xp=0,c=0;for(const t of s.tx)if(!t.undone){xp+=t.xp||0;c+=t.coins||0}return{xp,coins:c}}
function need(l){return 100+25*(l-1)}
function lvl(xp){let l=1,r=xp;while(r>=need(l)){r-=need(l);l++}return{l,cur:r,need:need(l)}}
function rank(l){return l>=50?"S":l>=35?"A":l>=20?"B":l>=10?"C":l>=5?"D":"E"}
function nextRank(l){const t=[[5,"D"],[10,"C"],[20,"B"],[35,"A"],[50,"S"]];return t.find(x=>x[0]>l)}
function completeQuest(s,id){const q=s.quests.find(x=>x.id===id);if(!q||q.status==="done")return false;q.status="done";q.doneAt=Date.now();s.tx.push({id:uid(),ts:Date.now(),type:"quest",qid:id,label:q.name,xp:q.xp,coins:q.coins,undone:false});return true}
function undoQuest(s,id){const q=s.quests.find(x=>x.id===id);if(!q||q.status!=="done")return"nothing";const t=s.tx.find(x=>x.qid===id&&!x.undone&&x.type==="quest");if(!t)return"nothing";if(totals(s).coins-t.coins<0)return"coins";t.undone=true;q.status="active";delete q.doneAt;return"ok"}
function buy(s,itemId){const it=s.shop.find(x=>x.id===itemId);if(!it)return"nothing";if(totals(s).coins<it.price)return"poor";s.tx.push({id:uid(),ts:Date.now(),type:"shop",label:"Bought: "+it.name,xp:0,coins:-it.price,undone:false});return"ok"}
function finishSession(s,sid,subject,min,date){if(s.sessions.some(x=>x.id===sid))return false;s.sessions.push({id:sid,date,subject,min,ts:Date.now()});s.tx.push({id:uid(),ts:Date.now(),type:"session",sid,label:min+" min focus: "+subject,xp:min,coins:Math.floor(min/10),undone:false});return true}
function dayMin(s,d){return s.sessions.filter(x=>x.date===d).reduce((a,x)=>a+x.min,0)}
function validate(o){return o&&typeof o==="object"&&o.v===1&&["quests","tx","sessions","chapters","shop"].every(k=>Array.isArray(o[k]))&&typeof o.name==="string"&&o.set&&typeof o.set==="object"&&o.tx.every(t=>t&&typeof t.id==="string"&&typeof t.xp==="number"&&typeof t.coins==="number")&&o.sessions.every(x=>x&&typeof x.min==="number"&&typeof x.date==="string")}
/* ---- storage ---- */
function dbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open("hunter-os",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function load(){try{db=await dbOpen();return await new Promise(res=>{const q=db.transaction("kv").objectStore("kv").get("state");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){memOnly=true;toast("Storage is unavailable (private window?). Progress will NOT be saved. Export often.","e");return null}}
function save(){if(!db)return;try{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(JSON.parse(JSON.stringify(S)),"state");t.onerror=()=>toast("Could not save. Export a backup now.","e")}catch(e){toast("Could not save. Export a backup now.","e")}}
function toast(m,k){const d=document.createElement("div");d.className="t"+(k?" "+k:"");d.textContent=m;$("#toast").appendChild(d);setTimeout(()=>d.remove(),k?7000:3800)}
function beep(){if(!S.set.sound)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.5)}catch(e){}if(window.Notification&&Notification.permission==="granted")try{new Notification("The System","Session complete")}catch(e){}}
/* ---- seeding & achievements ---- */
function seed(){const d=today(),w=weekKey();if(S.set.rest[d])return;if(!S.seeded[d]){S.seeded[d]=1;DAILY.forEach((q,i)=>S.quests.push({id:"d"+d+i,type:"daily",date:d,name:q[0],subject:q[1],diff:q[2],dur:q[3],xp:q[4],coins:q[5],status:"active"}))}
if(!S.seeded[w]){S.seeded[w]=1;WEEKLY.forEach((q,i)=>S.quests.push({id:"w"+w+i,type:"weekly",date:w,name:q[0],subject:q[1],diff:q[2],dur:q[3],xp:q[4],coins:q[5],status:"active"}))}}
function giveAch(id){if(!S.ach[id]){S.ach[id]=Date.now();toast("Title unlocked: "+ACH[id][0])}}
function checkAch(){const t=totals(S),d=today();if(S.sessions.length)giveAch("first");if(S.quests.some(q=>q.status==="done"))giveAch("q1");if(dayMin(S,d)>=60)giveAch("h1");if(dayMin(S,d)>=GOAL)giveAch("h5");if(lvl(t.xp).l>=5)giveAch("l5");if(S.quests.some(q=>q.status==="done"&&/error log/i.test(q.name)))giveAch("err")}
/* ---- timer ---- */
function startFocus(){const m=S.set.focus;S.timer={phase:"focus",end:Date.now()+m*60000,paused:null,startedAt:Date.now(),focusMin:m,brk:S.set.brk,subject:S.timer&&S.timer.subject||$("#subj")&&$("#subj").value||"Physics"};save();render()}
function tick(){const t=S.timer;if(!t)return;const left=t.paused!=null?t.paused:t.end-Date.now();const el=$("#tm");if(el){const s=Math.max(0,Math.ceil(left/1000));el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
if(t.paused==null&&left<=0){if(t.phase==="focus"){const prev=S.sessions.length?S.sessions[S.sessions.length-1].date:null;const before=dayMin(S,dstr(t.startedAt));const ok=finishSession(S,t.startedAt,t.subject,t.focusMin,dstr(t.startedAt));if(ok){if(prev&&(new Date(dstr(t.startedAt))-new Date(prev))/864e5>=3)giveAch("back");const after=dayMin(S,dstr(t.startedAt));for(let h=1;h<=5;h++)if(before<h*60&&after>=h*60)toast(h===5?"5 hours reached! Target complete. You can keep going.":h+" focused hour"+(h>1?"s":"")+" today");toast("Focus complete: +"+t.focusMin+" XP, +"+Math.floor(t.focusMin/10)+" coins");beep();checkAch()}
S.timer={phase:"break",end:Date.now()+t.brk*60000,paused:null,startedAt:Date.now(),focusMin:t.focusMin,brk:t.brk,subject:t.subject}}else{S.timer=null;toast("Break over. Ready when you are.");beep()}save();render()}}
/* ---- views ---- */
const gbar=()=>{const m=dayMin(S,today()),p=Math.min(100,Math.round(m/GOAL*100)),n=S.sessions.filter(x=>x.date===today()).length;return`<div class="row"><b class="big" style="font-size:1.6rem">${m}/${GOAL} min</b><span class="m">${Math.round(m/GOAL*100)}% · ${n} sessions · ${Math.max(0,GOAL-m)} min left</span></div><div class="bar" role="progressbar" aria-valuenow="${m}" aria-valuemax="${GOAL}"><i style="width:${p}%"></i></div><div class="ms" style="margin-top:8px">${[1,2,3,4,5].map(h=>`<span class="${m>=h*60?"on":""}">${h}h</span>`).join("")}</div>${m>=GOAL?'<p class="m">Daily target reached. Extra time still earns XP.</p>':""}`};
const qrow=q=>`<div class="q ${q.status==="done"?"done":""}"><div class="n">${esc(q.name)}<br><span class="tag">${esc(q.subject)}</span> <span class="tag">${["","easy","medium","hard"][q.diff]||""}</span> <span class="tag">${q.dur} min</span> <span class="tag">+${q.xp} XP ${q.coins?"+"+q.coins+"c":""}</span> ${q.status!=="done"&&q.status!=="active"?`<span class="tag">${q.status}</span>`:""}</div>${q.status==="done"?`<button class="sm" data-a="undo" data-id="${q.id}">Undo</button>`:q.status==="abandoned"?`<button class="sm" data-a="revive" data-id="${q.id}">Restore</button>`:`<button class="sm pri" data-a="done" data-id="${q.id}">Complete</button><button class="sm" data-a="edit" data-id="${q.id}">Edit</button><button class="sm" data-a="post" data-id="${q.id}">${q.status==="postponed"?"Resume":"Postpone"}</button><button class="sm dng" data-a="aband" data-id="${q.id}">Abandon</button>`}</div>`;
const views={
home(){const t=totals(S),L=lvl(t.xp),n=nextRank(L.l),tq=S.quests.filter(q=>q.date===today()&&q.type==="daily"&&q.status==="active").slice(0,5);const old=S.lastExport?Date.now()-S.lastExport>6048e5:Date.now()-S.created>6048e5;
return`${old&&t.xp>0?'<div class="card warn"><b>Backup reminder.</b> Your progress lives only in this browser. <button class="sm" data-a="export">Export backup</button></div>':""}
<div class="card"><div class="row"><div class="rank">${rank(L.l)}</div><div class="grow"><h1>${esc(S.name)}</h1><div class="m">Level ${L.l} · ${t.xp} XP total · <b style="color:#ffd35a">${t.coins} coins</b></div><div class="bar" style="margin-top:8px"><i style="width:${L.cur/L.need*100}%"></i></div><div class="m">${L.cur}/${L.need} XP to level ${L.l+1}${n?" · Rank "+n[1]+" at level "+n[0]:" · Top rank reached"}</div></div></div></div>
<div class="grid"><div class="card"><h2>Today's focus</h2>${gbar()}<p><button class="pri" data-a="go" data-v="study">Open Study Room</button></p></div>
<div class="card"><h2>Today's quests</h2>${S.set.rest[today()]?'<p class="m">Rest day. Nothing is lost. Come back whenever you are ready.</p>':tq.length?tq.map(qrow).join(""):'<p class="m">No active quests today. Add one in Quests.</p>'}</div></div>`},
quests(){const f=q=>filter==="All"||q.subject===filter;const L=S.quests.filter(f),sec=(t,h)=>{const a=L.filter(q=>q.type===t&&(t!=="daily"||q.date===today())&&(t!=="weekly"||q.date===weekKey()));return a.length?`<div class="card"><h2>${h}</h2>${a.map(qrow).join("")}</div>`:""};
return`<div class="card"><h2>New custom quest</h2><form data-f="addq" class="row"><input class="grow" type="text" name="n" placeholder="Quest name" required maxlength="80" aria-label="Quest name"><select name="s" aria-label="Subject" class="grow">${SUBJ.map(s=>`<option>${s}</option>`).join("")}</select><select name="d" aria-label="Difficulty"><option value="1">Easy</option><option value="2" selected>Medium</option><option value="3">Hard</option></select><input name="m" type="number" min="5" max="300" value="30" style="width:90px" aria-label="Minutes"><input name="x" type="number" min="1" max="100" value="20" style="width:90px" aria-label="XP"><input name="c" type="number" min="0" max="20" value="3" style="width:80px" aria-label="Coins"><button class="pri">Add quest</button></form><p class="m">Minutes, XP (max 100) and coins (max 20) are yours to set. Keep rewards honest.</p></div>
<div class="row" style="margin-bottom:10px"><label for="flt">Filter</label><select id="flt" data-c="filter" style="width:auto"><option>All</option>${SUBJ.map(s=>`<option ${filter===s?"selected":""}>${s}</option>`).join("")}</select></div>${S.set.rest[today()]?'<div class="card">Rest day: daily quests paused.</div>':""}${sec("daily","Daily quests")}${sec("weekly","Weekly missions")}${sec("custom","Custom quests")}`},
study(){const t=S.timer,idle=!t;let ctl;if(idle)ctl=`<button class="pri" data-a="start">Start focus</button>`;else if(t.phase==="break")ctl=`<button data-a="skip">Skip break</button><button class="dng" data-a="reset">Reset</button>`;else ctl=`${t.paused!=null?'<button class="pri" data-a="resume">Resume</button>':'<button data-a="pause">Pause</button>'}<button class="dng" data-a="reset">Reset</button>`;
return`<div class="card" style="text-align:center"><h2>${idle?"Ready":t.phase==="focus"?"Focus: "+esc(t.subject):"Break (not counted)"}</h2><div class="big" id="tm" style="font-size:4.5rem">${String(S.set.focus).padStart(2,"0")}:00</div><div class="row" style="justify-content:center;margin:10px 0">${ctl}</div>
${idle?`<div class="row" style="justify-content:center"><select id="subj" aria-label="Subject" style="width:auto">${SUBJ.map(s=>`<option>${s}</option>`).join("")}</select><button data-a="mode" data-f="50" data-b="10">50/10</button><button data-a="mode" data-f="25" data-b="5">25/5</button><input id="cf" type="number" min="5" max="180" value="${S.set.focus}" style="width:80px" aria-label="Focus minutes"><input id="cb" type="number" min="1" max="60" value="${S.set.brk}" style="width:80px" aria-label="Break minutes"><button data-a="custom">Set custom</button></div><p class="m">Current: ${S.set.focus} min focus / ${S.set.brk} min break</p>`:""}
<label class="m"><input type="checkbox" data-c="sound" ${S.set.sound?"checked":""}> Sound on (uncheck to mute)</label> <button class="sm" data-a="notif">Enable notifications</button><p class="m">Only completed focus sessions count. Closing the app does not stop the clock; a finished session is credited once when you return.</p></div>
<div class="card"><h2>Daily goal</h2>${gbar()}</div>
<div class="card"><h2>Session history</h2>${S.sessions.length?S.sessions.slice(-20).reverse().map(x=>`<div class="q"><span class="n">${x.date} · ${esc(x.subject)}</span><b>${x.min} min</b></div>`).join(""):'<p class="m">No sessions yet. Start your first focus block.</p>'}</div>`},
chapters(){return CH.map(s=>`<div class="card"><h2>${s}</h2><form data-f="addch" data-s="${s}" class="row"><input class="grow" type="text" name="n" placeholder="Add chapter name" required maxlength="80" aria-label="Chapter name"><button class="pri">Add</button></form>${S.chapters.filter(c=>c.subject===s).map(c=>`<div class="q"><span class="n">${esc(c.name)}</span><select data-c="chst" data-id="${c.id}" aria-label="Status" style="width:auto">${ST.map(x=>`<option ${c.st===x?"selected":""}>${x}</option>`).join("")}</select><label class="m">Lectures <input type="number" min="0" value="${c.lec}" data-c="chlec" data-id="${c.id}" style="width:70px"></label><label class="m"><input type="checkbox" data-c="chdpp" data-id="${c.id}" ${c.dpp?"checked":""}> DPP</label><label class="m"><input type="checkbox" data-c="chpyq" data-id="${c.id}" ${c.pyq?"checked":""}> PYQ</label><button class="sm dng" data-a="delch" data-id="${c.id}">Delete</button></div>`).join("")||'<p class="m">No chapters yet. Add your own; nothing is pre-filled.</p>'}</div>`).join("")},
shop(){const t=totals(S);return`<div class="card"><h2>Reward shop</h2><p class="big">${t.coins} <span class="m">coins (game currency only)</span></p><form data-f="addshop" class="row"><input class="grow" type="text" name="n" placeholder="Reward name" required maxlength="60" aria-label="Reward name"><input name="p" type="number" min="1" max="1000" value="30" style="width:100px" aria-label="Price"><button class="pri">Add reward</button></form></div>
<div class="card">${S.shop.map(i=>`<div class="q"><span class="n">${esc(i.name)}<br><span class="tag">${i.price} coins</span> ${t.coins>=i.price?'<span class="tag" style="color:var(--ok)">affordable</span>':'<span class="tag" style="color:var(--bad)">need '+(i.price-t.coins)+' more</span>'}</span><button class="pri" data-a="buy" data-id="${i.id}" ${t.coins<i.price?"disabled":""}>Buy</button><button class="sm dng" data-a="delshop" data-id="${i.id}">Remove</button></div>`).join("")||'<p class="m">Add something to look forward to.</p>'}</div>
<div class="card"><h2>Purchases</h2>${S.tx.filter(x=>x.type==="shop").slice(-15).reverse().map(x=>`<div class="q"><span class="n">${esc(x.label)}</span><span>${x.coins}c</span></div>`).join("")||'<p class="m">No purchases yet.</p>'}</div>`},
profile(){const t=totals(S),L=lvl(t.xp),fm=S.sessions.reduce((a,x)=>a+x.min,0),days=new Set(S.sessions.map(x=>x.date)),best=Math.max(0,...[...days].map(d=>dayMin(S,d))),r30=[...days].filter(d=>Date.now()-new Date(d)<30*864e5).length,kn=S.chapters.filter(c=>["First pass completed","Revised","Test completed"].includes(c.st)).length,qd=S.quests.filter(q=>q.status==="done").length;
const wk=[...Array(7)].map((_,i)=>{const d=dstr(Date.now()-(6-i)*864e5);return[d.slice(5),dayMin(S,d)]}),mx=Math.max(60,...wk.map(x=>x[1]));const mo=S.sessions.filter(x=>x.date.slice(0,7)===today().slice(0,7)).reduce((a,x)=>a+x.min,0);
const sub=SUBJ.map(s=>[s,S.sessions.filter(x=>x.subject===s).reduce((a,x)=>a+x.min,0)]);
return`<div class="card"><div class="row"><div class="rank">${rank(L.l)}</div><div class="grow"><form data-f="name" class="row"><input class="grow" type="text" name="n" value="${esc(S.name)}" maxlength="24" aria-label="Hunter name"><button>Save name</button></form><div class="m">Level ${L.l} · ${t.xp} XP · ${t.coins} coins · ${qd} quests done</div></div></div></div>
<div class="grid"><div class="card"><h2>Attributes</h2>${[["Focus",Math.floor(fm/60),"focused hours"],["Knowledge",kn,"chapters past first pass"],["Discipline",days.size,"active study days"],["Consistency",r30,"active days in last 30"],["Endurance",Math.floor(best/60),"hours in your best day"]].map(a=>`<div class="q"><b class="n">${a[0]} ${a[1]}</b><span class="m">${a[2]}</span></div>`).join("")}</div>
<div class="card"><h2>Titles</h2>${Object.keys(ACH).map(k=>`<div class="q"><span class="n" style="${S.ach[k]?"":"opacity:.45"}"><b>${ACH[k][0]}</b><br><span class="m">${ACH[k][1]}</span></span>${S.ach[k]?"✓":""}</div>`).join("")}</div></div>
<div class="card"><h2>Last 7 days (minutes)</h2><div class="bars">${wk.map(x=>`<div><i style="height:${x[1]/mx*80}px"></i>${x[1]}<br>${x[0]}</div>`).join("")}</div><p class="m">This month: ${Math.round(mo/6)/10} h · By subject: ${sub.map(s=>s[0]+" "+Math.round(s[1]/6)/10+"h").join(", ")}</p></div>
<div class="card"><h2>Activity log</h2>${S.tx.slice(-20).reverse().map(x=>`<div class="q ${x.undone?"done":""}"><span class="n">${new Date(x.ts).toLocaleString()} · ${esc(x.label)}</span><span>${x.xp?"+"+x.xp+" XP ":""}${x.coins?(x.coins>0?"+":"")+x.coins+"c":""}${x.undone?" (undone)":""}</span></div>`).join("")||'<p class="m">Nothing yet.</p>'}</div>
<div class="card"><h2>Settings and backup</h2><div class="row"><button class="pri" data-a="export">Export backup</button><label class="row"><span>Import backup</span><input type="file" accept=".json,application/json" data-c="import"></label></div><label class="row"><input type="checkbox" data-c="reduce" ${S.set.reduce?"checked":""}> Reduce motion</label><label class="row"><input type="checkbox" data-c="rest" ${S.set.rest[today()]?"checked":""}> Rest day today (pauses daily quests; nothing is lost)</label><p><button class="dng" data-a="reset">Reset all progress</button></p></div>
<div class="card"><h2>Rules</h2><p class="m">Quest XP and coins are granted once when you confirm Complete; Undo reverses them exactly. Focus sessions give 1 XP per minute and 1 coin per 10 minutes. Level n to n+1 costs 100 + 25×(n−1) XP. Ranks by level: E start, D 5, C 10, B 20, A 35, S 50. Nothing is ever deducted for missed days; XP, levels and titles never go down. Coins are fictional and can only be spent on rewards you define. Attributes are computed from your real logged activity. Data lives in this browser only; clearing site data erases it, so export backups regularly.</p></div>`}};
const TABS=[["home","Home"],["quests","Quests"],["study","Study"],["chapters","Chapters"],["shop","Shop"],["profile","Profile"]];
function render(){document.body.classList.toggle("reduce",!!S.set.reduce);$("#nav").innerHTML=TABS.map(t=>`<button data-a="go" data-v="${t[0]}" class="${view===t[0]?"on":""}" ${view===t[0]?'aria-current="page"':""}>${t[1]}</button>`).join("");$("#app").innerHTML=views[view]();tick()}
/* ---- actions ---- */
const A={go:d=>{view=d.v;render();scrollTo(0,0)},
done:d=>{if(completeQuest(S,d.id)){const q=S.quests.find(x=>x.id===d.id);toast("Quest complete: +"+q.xp+" XP"+(q.coins?", +"+q.coins+" coins":""));const before=lvl(totals(S).xp-q.xp).l,now=lvl(totals(S).xp).l;if(now>before)toast("LEVEL UP! Level "+now+" · Rank "+rank(now));checkAch();save();render()}},
undo:d=>{if(!confirm("Undo this completion? Its XP and coins will be removed."))return;const r=undoQuest(S,d.id);if(r==="coins")toast("Cannot undo: you have already spent those coins.","e");else if(r==="ok")toast("Completion undone");save();render()},
edit:d=>{const q=S.quests.find(x=>x.id===d.id),n=prompt("Quest name",q.name);if(n===null)return;const x=parseInt(prompt("XP reward (1-100)",q.xp),10);q.name=n.trim()||q.name;if(x>=1&&x<=100)q.xp=x;save();render()},
post:d=>{const q=S.quests.find(x=>x.id===d.id);q.status=q.status==="postponed"?"active":"postponed";save();render()},
aband:d=>{if(!confirm("Abandon this quest? No penalty; you can restore it."))return;S.quests.find(x=>x.id===d.id).status="abandoned";save();render()},
revive:d=>{S.quests.find(x=>x.id===d.id).status="active";save();render()},
start:()=>startFocus(),pause:()=>{const t=S.timer;t.paused=Math.max(0,t.end-Date.now());save();render()},resume:()=>{const t=S.timer;t.end=Date.now()+t.paused;t.paused=null;save();render()},
reset:d=>{if(view==="study"&&S.timer){if(!confirm("Reset the timer? An unfinished focus block earns nothing."))return;S.timer=null;save();render();return}if(view==="profile"){if(!confirm("Reset ALL progress? Export a backup first."))return;if(!confirm("Really erase everything?"))return;S=fresh();seed();save();render();toast("Progress reset")}},
skip:()=>{S.timer=null;save();render()},mode:d=>{S.set.focus=+d.f;S.set.brk=+d.b;save();render()},
custom:()=>{const f=parseInt($("#cf").value,10),b=parseInt($("#cb").value,10);if(f>=5&&f<=180&&b>=1&&b<=60){S.set.focus=f;S.set.brk=b;save();render()}else toast("Focus 5-180 min, break 1-60 min.","e")},
notif:()=>{if(window.Notification)Notification.requestPermission().then(p=>toast(p==="granted"?"Notifications on":"Notifications not allowed"));else toast("Notifications not supported here.","e")},
delch:d=>{if(!confirm("Delete this chapter?"))return;S.chapters=S.chapters.filter(c=>c.id!==d.id);save();render()},
buy:d=>{const it=S.shop.find(x=>x.id===d.id);if(!confirm("Buy '"+it.name+"' for "+it.price+" coins?"))return;const r=buy(S,d.id);toast(r==="ok"?"Enjoy your reward":"Not enough coins",r==="ok"?"":"e");save();render()},
delshop:d=>{if(!confirm("Remove this reward?"))return;S.shop=S.shop.filter(x=>x.id!==d.id);save();render()},
export:()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hunter-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();S.lastExport=Date.now();save();toast("Backup downloaded. Keep the file somewhere safe.")}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a]&&!b.disabled)A[b.dataset.a](b.dataset)});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,k=f.dataset.f,v=n=>f.elements[n]&&f.elements[n].value;
if(k==="addq"){const x=Math.min(100,Math.max(1,+v("x")||20));S.quests.push({id:uid(),type:"custom",date:today(),name:v("n").trim(),subject:v("s"),diff:+v("d"),dur:+v("m")||30,xp:x,coins:Math.min(20,Math.max(0,+v("c")||0)),status:"active"});toast("Quest added")}
else if(k==="addch")S.chapters.push({id:uid(),subject:f.dataset.s,name:v("n").trim(),st:ST[0],lec:0,dpp:false,pyq:false});
else if(k==="addshop")S.shop.push({id:uid(),name:v("n").trim(),price:Math.max(1,+v("p")||1)});
else if(k==="name")S.name=v("n").trim()||"Hunter";
save();render()});
document.addEventListener("change",e=>{const t=e.target,c=t.dataset.c;if(!c)return;const ch=S.chapters.find(x=>x.id===t.dataset.id);
if(c==="filter")filter=t.value;else if(c==="sound")S.set.sound=t.checked;else if(c==="reduce")S.set.reduce=t.checked;
else if(c==="rest"){if(t.checked)S.set.rest[today()]=1;else delete S.set.rest[today()];seed()}
else if(c==="chst")ch.st=t.value;else if(c==="chlec")ch.lec=Math.max(0,+t.value||0);else if(c==="chdpp")ch.dpp=t.checked;else if(c==="chpyq")ch.pyq=t.checked;
else if(c==="import"){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(x){toast("Not a valid JSON file. Nothing changed.","e");return}if(!validate(o)){toast("This is not a valid backup. Nothing changed.","e");return}if(!confirm("Replace your current progress with this backup ("+o.tx.length+" transactions, "+o.sessions.length+" sessions)? Your current data will be overwritten."))return;S=Object.assign(fresh(),o);seed();save();render();toast("Backup imported")};r.onerror=()=>toast("Could not read the file.","e");r.readAsText(f);return}
save();render()});
setInterval(tick,500);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
(async()=>{const s=await load();if(s&&validate(s))S=Object.assign(fresh(),s);else if(s)toast("Saved data looked damaged; starting fresh. Import a backup if you have one.","e");seed();checkAch();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});save();render()})();
</script></body></html>
